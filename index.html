<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartFormat</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
</head>
<body class="ms-font-m">
    
    <div class="tab-container">
        <button class="tab-btn active" onclick="switchTab(event, 'tab-format')">Format Tools</button>
        <button class="tab-btn" onclick="switchTab(event, 'tab-icons')">Brand Icons</button>
    </div>

    <div id="tab-format" class="tab-content active">
        <div id="content-main" class="ms-welcome">
            
            <header class="header">
                <h1 class="smartformat-title">SmartFormat V13</h1>
            </header>
            
            <div class="command-group">
                <button id="btnFixBrand" class="large-button">Fix Brand's Text and Color</button>
                <div class="grid-2x2">
                    <button id="btnThemeFont">Fix Theme Font</button>
                    <button id="btnThemeColor">Fix Theme Color</button>
                    <button id="btnMerge">Merge</button>
                    <button id="btnZeroMargin">Zero Margin</button>
                </div>
                <div class="grid-2x2">
                    <button id="btn1stLevelBullet">1st Level Bullet</button>
                    <button id="btn2ndLevelBullet">2nd Level Bullet</button>
                </div>
            </div>
            
            <hr class="divider"/>
            
            <h2 class="section-title">Textbox properties</h2>
            <div class="grid-2x2">
                <button id="btnCopy">Copy</button>
                <button id="btnPaste">Paste</button>
            </div>
            
            <hr class="divider"/>
            
            <h2 class="section-title">Align</h2>
            <div class="icon-row align-icons">
                <button id="btnAlignLeft" class="icon-button"><img src="btnAlignLeft.svg" alt="Align Left"/></button>
                <button id="btnAlignRight" class="icon-button"><img src="btnAlignRight.svg" alt="Align Right"/></button>
                <button id="btnAlignTop" class="icon-button"><img src="btnAlignTop.svg" alt="Align Top"/></button>
                <button id="btnAlignBottom" class="icon-button"><img src="btnAlignBottom.svg" alt="Align Bottom"/></button>
                <button id="btnAlignCenterV" class="icon-button"><img src="btnAlignCenterV.svg" alt="Align Center V"/></button>
                <button id="btnAlignCenterH" class="icon-button"><img src="btnAlignCenterH.svg" alt="Align Center H"/></button>
                <button id="btnAlignMiddle" class="icon-button"><img src="btnAlignMiddle.svg" alt="Align Middle"/></button>
            </div>

            <h2 class="section-title">Distribute</h2>
            <div class="icon-row distribute-icons">
                <button id="btnDistributeH" class="icon-button"><img src="btnDistributeH.svg" alt="Distribute H"/></button>
                <button id="btnDistributeV" class="icon-button"><img src="btnDistributeV.svg" alt="Distribute V"/></button>
                <button id="btnDistributeSpacingH" class="icon-button"><img src="btnDistributeHwithSpace.svg" alt="Exact Gap H"/></button>
                <button id="btnDistributeSpacingV" class="icon-button"><img src="btnDistributeVwithSpace.svg" alt="Exact Gap V"/></button>
                <div class="spinner-container">
                    <input type="number" id="numDistributeValue" value="0" min="0" step="0.1" class="num-input">
                    <span class="unit">cm</span>
                </div>
            </div>
        
            <hr class="divider"/>
            
            <h2 class="section-title">Before Space (VBA Required)</h2>
            <div class="space-control-row">
                <div class="button-group">
                    <button id="btnBefore0" class="space-btn">0</button>
                    <button id="btnBefore1x" class="space-btn">1x</button>
                    <button id="btnBefore2x" class="space-btn">2x</button>
                </div>
            </div>
            
            <h2 class="section-title">After Space (VBA Required)</h2>
            <div class="space-control-row">
                <div class="button-group">
                    <button id="btnAfter0" class="space-btn">0</button>
                    <button id="btnAfter1x" class="space-btn">1x</button>
                    <button id="btnAfter2x" class="space-btn">2x</button>
                </div>
            </div>
        </div> 
    </div> <div id="tab-icons" class="tab-content">
        <div class="content-main">
            <div class="search-container">
                <input type="text" id="iconSearchInput" placeholder="Search icons..." onkeyup="filterIcons()">
            </div>

            <div id="iconGrid" class="icon-grid">
                </div>
        </div>
    </div> <hr class="divider"/>
    <h2 class="section-title">Debug Console</h2>
    <div id="on-screen-console">
        <div class="log-msg">> Console ready...</div>
    </div>
        
    <script src="functions.js?v=11"></script>
</body>
</html>
